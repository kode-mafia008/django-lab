{% extends "blog/base.html" %}

{% block title %}Authors{% endblock %}

{% block content %}

<h2>Authors ({{ authors|length }})</h2>

<ul>
    {% for author in authors %}
        <li>
            <a href="{% url 'blog:author-detail' author.pk %}">
                {{ author.name }}
            </a>
        </li>
    {% empty %}
        <li>No authors yet.</li>
    {% endfor %}
</ul>

{% endblock %}

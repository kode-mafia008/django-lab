<li class="card">
  <a href="{% url 'book-detail' book.pk %}"><strong>{{ book.title }}</strong></a>
  <span class="meta">
    {{ book.year }} &middot; Rs {{ book.price }}
    &middot; {{ book.author.name|default:"Unknown author" }}
  </span>
  {% if book.genres.all %}
    <span class="tags">
      {% for genre in book.genres.all %}<em>{{ genre.name }}</em>{% endfor %}
    </span>
  {% endif %}
</li>
